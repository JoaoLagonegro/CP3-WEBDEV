<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio de desenvolvimento front-end com projetos carregados do GitHub."
    />
    <title>João Pedro Lagonegro | Portfólio</title>
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a tela não piscar
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark',
        );
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
